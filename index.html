<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Network Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, Monaco, 'Lucida Console', monospace;
            background: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            overflow: hidden;
        }

        .chat-container {
            background: #0a0a0a;
            border: 1px solid #00ff41;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #000000;
            color: #00ff41;
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #00ff41;
        }

        .chat-header h1 {
            font-size: 16px;
            font-weight: normal;
            margin-bottom: 3px;
            letter-spacing: 1px;
        }

        .status {
            font-size: 11px;
            opacity: 0.8;
        }

        .status.connected {
            color: #00ff41;
        }

        .status.connected::before {
            content: '> ';
        }

        .status.disconnected {
            color: #ff4444;
        }

        .status.disconnected::before {
            content: '! ';
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #0a0a0a;
            overflow-x: hidden;
        }

        /* Custom scrollbar for terminal look */
        .messages-container::-webkit-scrollbar {
            width: 8px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: #000000;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #00ff41;
            border-radius: 0;
        }

        .message {
            margin-bottom: 12px;
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-5px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message-header {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
            flex-wrap: wrap;
        }

        .message-ip {
            font-weight: normal;
            color: #00ff41;
            margin-right: 8px;
            font-size: 13px;
        }

        .message-ip::before {
            content: '[';
            color: #00ff41;
        }

        .message-ip::after {
            content: ']';
            color: #00ff41;
        }

        .message-time {
            font-size: 11px;
            color: #666666;
        }

        .message-content {
            background: transparent;
            padding: 5px 0;
            color: #00ff41;
            border-left: 2px solid #00ff41;
            padding-left: 10px;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 14px;
        }

        .message.own .message-content {
            background: transparent;
            color: #00cccc;
            border-left: 2px solid #00cccc;
        }

        .message.own .message-ip {
            color: #00cccc;
        }

        .input-container {
            padding: 12px 15px;
            background: #000000;
            border-top: 1px solid #00ff41;
            display: flex;
            gap: 8px;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #00ff41;
            background: #0a0a0a;
            color: #00ff41;
            font-size: 14px;
            font-family: 'Courier New', Courier, Monaco, 'Lucida Console', monospace;
            outline: none;
            border-radius: 0;
            -webkit-appearance: none;
        }

        .message-input::placeholder {
            color: #004400;
        }

        .message-input:focus {
            border-color: #00ff41;
            background: #000000;
        }

        .send-button {
            padding: 12px 20px;
            background: transparent;
            color: #00ff41;
            border: 1px solid #00ff41;
            cursor: pointer;
            font-weight: normal;
            font-family: 'Courier New', Courier, Monaco, 'Lucida Console', monospace;
            font-size: 14px;
            transition: all 0.2s;
            border-radius: 0;
            -webkit-appearance: none;
            min-width: 70px;
        }

        .send-button:active {
            background: #00ff41;
            color: #000000;
        }

        .send-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .loading {
            text-align: left;
            padding: 20px 0;
            color: #00ff41;
            font-size: 13px;
        }

        .loading::before {
            content: '> ';
        }

        .error {
            background: transparent;
            color: #ff4444;
            padding: 8px;
            margin: 10px 0;
            border-left: 2px solid #ff4444;
            text-align: left;
            font-size: 13px;
        }

        .error::before {
            content: '[ERROR] ';
        }

        /* Mobile optimizations */
        @media (min-width: 768px) {
            body {
                padding: 20px;
            }

            .chat-container {
                max-width: 900px;
                height: 95vh;
                max-height: 800px;
            }

            .chat-header {
                padding: 15px 20px;
            }

            .chat-header h1 {
                font-size: 18px;
            }

            .messages-container {
                padding: 20px;
            }

            .input-container {
                padding: 15px 20px;
            }

            .send-button:hover {
                background: #00ff41;
                color: #000000;
            }
        }

        /* Extra small mobile screens */
        @media (max-width: 360px) {
            .chat-header h1 {
                font-size: 14px;
            }

            .message-ip {
                font-size: 12px;
            }

            .message-content {
                font-size: 13px;
            }

            .send-button {
                padding: 12px 15px;
                min-width: 60px;
                font-size: 13px;
            }
        }

        /* Landscape mobile optimization */
        @media (max-height: 500px) and (orientation: landscape) {
            .chat-header {
                padding: 8px 15px;
            }

            .chat-header h1 {
                font-size: 14px;
                margin-bottom: 2px;
            }

            .status {
                font-size: 10px;
            }

            .input-container {
                padding: 8px 15px;
            }

            .message-input,
            .send-button {
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>LOCAL NETWORK CHAT</h1>
            <div class="status" id="status">Connecting...</div>
        </div>

        <div class="messages-container" id="messages">
            <div class="loading">Loading messages...</div>
        </div>

        <div class="input-container">
            <input
                type="text"
                class="message-input"
                id="messageInput"
                placeholder="Type your message..."
                disabled
            >
            <button class="send-button" id="sendButton" disabled>Send</button>
        </div>
    </div>

    <script>
        let ws;
        let clientIP = '';
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;

        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const statusElement = document.getElementById('status');

        // Get WebSocket URL (handle different protocols and hosts)
        function getWebSocketURL() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${protocol}//${window.location.host}/ws`;
        }

        // Format timestamp
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;

            const diffHours = Math.floor(diffMins / 60);
            if (diffHours < 24) return `${diffHours}h ago`;

            return date.toLocaleString();
        }

        // Update status display
        function updateStatus(connected) {
            if (connected) {
                statusElement.textContent = `Connected as ${clientIP}`;
                statusElement.className = 'status connected';
                messageInput.disabled = false;
                sendButton.disabled = false;
                reconnectAttempts = 0;
            } else {
                statusElement.textContent = 'Disconnected';
                statusElement.className = 'status disconnected';
                messageInput.disabled = true;
                sendButton.disabled = true;
            }
        }

        // Add message to UI
        function addMessage(message, isOwn = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isOwn ? 'own' : ''}`;

            const headerDiv = document.createElement('div');
            headerDiv.className = 'message-header';

            const ipSpan = document.createElement('span');
            ipSpan.className = 'message-ip';
            ipSpan.textContent = message.client_ip;

            const timeSpan = document.createElement('span');
            timeSpan.className = 'message-time';
            timeSpan.textContent = formatTime(message.timestamp);

            headerDiv.appendChild(ipSpan);
            headerDiv.appendChild(timeSpan);

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = message.content;

            messageDiv.appendChild(headerDiv);
            messageDiv.appendChild(contentDiv);

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Clear messages container
        function clearMessages() {
            messagesContainer.innerHTML = '';
        }

        // Send message
        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }

            ws.send(JSON.stringify({ content }));
            messageInput.value = '';
        }

        // Connect to WebSocket
        function connect() {
            const wsURL = getWebSocketURL();
            console.log('Connecting to:', wsURL);

            ws = new WebSocket(wsURL);

            ws.onopen = () => {
                console.log('WebSocket connected');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    switch (data.type) {
                        case 'connected':
                            clientIP = data.client_ip;
                            updateStatus(true);
                            clearMessages();

                            // Load message history
                            if (data.history && data.history.length > 0) {
                                data.history.forEach(msg => {
                                    addMessage(msg, msg.client_ip === clientIP);
                                });
                            } else {
                                messagesContainer.innerHTML = '<div class="loading">No messages yet. Start the conversation!</div>';
                            }
                            break;

                        case 'message':
                            // Remove "no messages" text if present
                            const loading = messagesContainer.querySelector('.loading');
                            if (loading) {
                                loading.remove();
                            }

                            addMessage(data.message, data.message.client_ip === clientIP);
                            break;

                        default:
                            console.log('Unknown message type:', data.type);
                    }
                } catch (error) {
                    console.error('Error parsing message:', error);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                showError('Connection error. Please check your network.');
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                updateStatus(false);

                // Attempt to reconnect
                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 10000);
                    console.log(`Reconnecting in ${delay}ms... (attempt ${reconnectAttempts})`);
                    setTimeout(connect, delay);
                } else {
                    showError('Unable to connect to server. Please refresh the page.');
                }
            };
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            messagesContainer.appendChild(errorDiv);
            setTimeout(() => errorDiv.remove(), 5000);
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Start connection
        connect();
    </script>
</body>
</html>
